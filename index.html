<html dir="rtl" lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>شبكة وقايتي - إدارة العيادات</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{
  --bg:#f4f6f8; --card:#ffffff; --text:#1c2430; --sub:#6b7280; --line:#e3e7eb;
  --brand:#5b3fa0; --brand2:#7a5cc9; --accent:#2e7d6b; --danger:#c0392b;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg:#141821; --card:#1d2330; --text:#e8ebf0; --sub:#9aa4b2; --line:#2b3241; }
}
:root[data-theme="dark"]{ --bg:#141821; --card:#1d2330; --text:#e8ebf0; --sub:#9aa4b2; --line:#2b3241; }
html{scroll-padding-top:env(safe-area-inset-top,0px); height:100%;}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Segoe UI",Tahoma,Arial,sans-serif;height:100%;}
.wrap{max-width:960px;margin:0 auto;padding:16px;}
header{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px;flex-wrap:wrap;}
h1{font-size:19px;margin:0;color:var(--brand);}
.count{font-size:12px;color:var(--sub);margin-bottom:12px;}
.search{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--text);font-size:14px;margin-bottom:12px;}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;max-height:130px;overflow-y:auto;padding:4px;border:1px solid var(--line);border-radius:12px;background:var(--card);}
.tab{padding:7px 13px;border-radius:20px;border:1px solid var(--line);background:var(--bg);cursor:pointer;font-size:13px;color:var(--text);white-space:nowrap;}
.tab.active{background:var(--brand);color:#fff;border-color:var(--brand);}
.tab.add{background:transparent;border:1px dashed var(--brand2);color:var(--brand2);}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px;}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
@media(max-width:560px){.grid{grid-template-columns:1fr;}}
label{font-size:12px;color:var(--sub);display:block;margin-bottom:4px;}
input,select{width:100%;padding:9px 10px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--text);font-size:14px;}
.actions{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap;}
button{cursor:pointer;border:none;border-radius:8px;padding:9px 16px;font-size:14px;}
.btn-primary{background:var(--brand);color:#fff;}
.btn-secondary{background:transparent;border:1px solid var(--line);color:var(--text);}
.city-block{margin-bottom:18px;}
.city-title{font-weight:700;color:var(--brand2);border-bottom:2px solid var(--line);padding-bottom:4px;margin-bottom:8px;font-size:15px;display:flex;justify-content:space-between;}
.city-title .n{font-size:12px;color:var(--sub);font-weight:400;}
.dept-block{margin-bottom:28px;}
.dept-title{font-weight:800;color:#fff;background:linear-gradient(90deg,var(--brand),var(--brand2));padding:9px 14px;border-radius:10px;margin-bottom:12px;font-size:16px;display:flex;justify-content:space-between;}
.dept-title .n{font-size:12px;color:#f0edf9;font-weight:400;}
.img-grid{display:flex;flex-wrap:wrap;gap:10px;}
.img-thumb{position:relative;width:92px;height:92px;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--bg);}
.img-thumb img{width:100%;height:100%;object-fit:cover;display:block;}
.img-thumb .del-x{position:absolute;top:3px;left:3px;background:rgba(192,57,43,0.92);color:#fff;border:none;border-radius:50%;width:22px;height:22px;font-size:13px;line-height:1;cursor:pointer;padding:0;}
.img-panel-hint{font-size:12px;color:var(--sub);margin-bottom:10px;}
.entry{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px;display:flex;justify-content:space-between;gap:10px;align-items:flex-start;flex-wrap:wrap;}
.entry .info b{font-size:15px;}
.entry .info div{font-size:13px;color:var(--sub);margin-top:2px;}
.entry .btns{display:flex;gap:6px;}
.entry .btns button{padding:5px 10px;font-size:12px;}
.edit-btn{background:#e8e0f7;color:var(--brand);}
.del-btn{background:#fbe4e1;color:var(--danger);}
.empty{color:var(--sub);text-align:center;padding:24px;font-size:14px;}
.hint{font-size:12px;color:var(--sub);margin-top:6px;}
.reset-link{font-size:12px;color:var(--sub);text-decoration:underline;cursor:pointer;background:none;border:none;padding:0;}
.btn-outline{background:transparent;border:1px solid var(--brand);color:var(--brand);}
#printArea{display:none;}
@page{ size:auto; margin:0.9cm; }
@media print{
  body *{ visibility:hidden; }
  #printArea, #printArea *{ visibility:visible; }
  #printArea{ display:block; position:static; padding:0; margin:0; }
  .pdf-cover-page{ display:flex !important; page-break-after:always; break-after:page; }
}
/* force the browser to actually print background colors (blue banners, etc.)
   instead of silently stripping them */
#printArea, #printArea *{ -webkit-print-color-adjust:exact; print-color-adjust:exact; color-adjust:exact; }
.pdf-cover-page{width:100%;height:27cm;display:flex;align-items:center;justify-content:center;background:#fff;page-break-after:always;break-after:page;overflow:hidden;}
.pdf-cover-page img{max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain;display:block;margin:auto;}

/* The whole document is ONE <table>. Its <thead> holds ONLY the logo, so
   the browser's native "repeat thead on every printed page" behaviour
   fires exactly once per REAL physical page break - never mid-page, no
   matter which department happens to be printing at that point. The
   department banner and the column-header row are just normal rows inside
   <tbody>, so each prints exactly once, right where it naturally falls,
   and is never duplicated on a continuation page. Because there is no
   forced page break between departments, a department simply continues
   directly under whatever room is left, with nothing wasted. */
.pdf-title-banner{
  background:#1a56db; color:#ffffff; font-weight:800; font-size:16px; padding:10px 14px;
  text-align:center; border:1px solid #1543a8; margin-bottom:10px;
}
table.pdf-table{ width:100%; border-collapse:collapse; margin-bottom:4px; font-size:12px; table-layout:fixed; }
table.pdf-table col.c-name{ width:30%; } table.pdf-table col.c-addr{ width:48%; } table.pdf-table col.c-phone{ width:22%; }
table.pdf-table thead{ display:table-header-group; }
table.pdf-table thead tr{ page-break-inside:avoid; break-inside:avoid; }
table.pdf-table .logo-row td{ border:none; padding:0; }
.pdf-logo-header{ text-align:center; padding-bottom:8px; }
.pdf-logo-header img{ width:100%; max-width:900px; max-height:4.6cm; object-fit:contain; display:block; margin:0 auto; }

table.pdf-table tbody tr.dept-row td{ border:none; padding:0; }
.pdf-dept-banner{
  background:linear-gradient(90deg,#1543a8,#1a56db);
  color:#fff; font-weight:800; font-size:15px; padding:9px 14px;
  margin:16px 0 0 0; text-align:center;
}
table.pdf-table tbody tr:first-child .pdf-dept-banner{ margin-top:0; }
table.pdf-table tbody tr.dept-row,
table.pdf-table tbody tr.col-header-row{ page-break-after:avoid; break-after:avoid-page; page-break-inside:avoid; break-inside:avoid; }
table.pdf-table th{ background:#eef2f7; color:#000; font-weight:800; padding:7px 8px; border:1px solid #9aa4ad; font-size:12.5px; text-align:center; }
table.pdf-table td{ padding:6px 8px; border:1px solid #b9c2ca; vertical-align:top; word-wrap:break-word; text-align:center; color:#111; }
table.pdf-table td.name-cell{ text-align:right; }
table.pdf-table td.name-cell b{ display:block; font-size:12.5px; }
table.pdf-table td.name-cell span{ display:block; font-size:11px; color:#555; font-weight:400; }
table.pdf-table td.phone-cell{ text-align:left; direction:ltr; }
table.pdf-table td.phone-cell .phone-line{ display:block; line-height:1.7; }
table.pdf-table tbody tr{ page-break-inside:avoid; break-inside:avoid; }
</style>
</head>

// Reads an image file, downsizes/compresses it so it doesn't bloat storage
// or the PDF, then returns a base64 JPEG data URL via callback.
function readImageFile(file, callback){
  const reader = new FileReader();
  reader.onload = function(evt){
    const img = new Image();
    img.onload = function(){
      const maxDim = 800;
      let w = img.width, h = img.height;
      if(w > maxDim || h > maxDim){
        if(w >= h){ h = Math.round(h * maxDim / w); w = maxDim; }
        else { w = Math.round(w * maxDim / h); h = maxDim; }
      }
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      callback(canvas.toDataURL('image/jpeg', 0.75));
    };
    img.onerror = function(){ alert('تعذر قراءة هذه الصورة.'); };
    img.src = evt.target.result;
  };
  reader.onerror = function(){ alert('تعذر قراءة هذه الصورة.'); };
  reader.readAsDataURL(file);
}

    t.className = 'city-title';
    t.innerHTML = '<span>'+escapeHtml(city || "بدون محافظة")+'</span><span class="n">'+byCity[city].length+' عيادة</span>';
    block.appendChild(t);
    const list = byCity[city].slice().sort((a,b)=> (b.ts||0) - (a.ts||0));
    list.forEach(e=>{
      const row = document.createElement('div');
      row.className = 'entry';
      row.innerHTML = `
        <div class="info">
          <b>${escapeHtml(e.name)}</b> ${showDeptTag ? '<span style="font-size:11px;color:var(--sub)">['+escapeHtml(e.dept)+']</span>' : ''}
          <div>${escapeHtml(e.specialty||'')}</div>
          <div>📞 ${escapeHtml(e.phone||'')}</div>
          <div>${escapeHtml(e.subregion? e.subregion+' - ':'')}${escapeHtml(e.address||'')}</div>
        </div>
        <div class="btns">
          <button class="edit-btn">تعديل</button>
          <button class="del-btn">حذف</button>
        </div>`;
      row.querySelector('.edit-btn').onclick = ()=> openForm(e);
      row.querySelector('.del-btn').onclick = ()=>{
        if(confirm('حذف هذه العيادة؟')){
          state.entries = state.entries.filter(x=>x.id!==e.id);
          saveData(); renderAll();
        }
      };
      block.appendChild(row);
    });
    container.appendChild(block);
  });
}

function renderList(){
  const area = document.getElementById('listArea');
  area.innerHTML = "";

  if(searchTerm){
    const entries = state.entries.filter(matchesSearch);
    if(entries.length===0){ area.innerHTML = '<div class="empty">لا توجد نتائج.</div>'; return; }
    renderCityGroups(area, entries, true);
    return;
  }

  if(activeDept === ALL_DEPT){
    if(state.entries.length===0){ area.innerHTML = '<div class="empty">لا توجد نتائج.</div>'; return; }
    state.depts.forEach(dep=>{
      const deptEntries = state.entries.filter(e=>e.dept===dep);
      if(deptEntries.length===0) return;
      const deptBlock = document.createElement('div');
      deptBlock.className = 'dept-block';
      const dt = document.createElement('div');
      dt.className = 'dept-title';
      dt.innerHTML = '<span>'+escapeHtml(dep)+'</span><span class="n">'+deptEntries.length+' عيادة</span>';
      deptBlock.appendChild(dt);
      renderCityGroups(deptBlock, deptEntries, false);
      area.appendChild(deptBlock);
    });
    return;
  }

  if(!activeDept){ area.innerHTML = '<div class="empty">لا يوجد أقسام بعد. أضف قسمًا جديدًا.</div>'; return; }
  const entries = state.entries.filter(e=>e.dept===activeDept);
  if(entries.length===0){ area.innerHTML = '<div class="empty">لا توجد نتائج.</div>'; return; }
  renderCityGroups(area, entries, false);
}

function escapeHtml(s){ return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function openForm(entry){
  editingId = entry ? entry.id : null;
  const card = document.getElementById('formCard');
  card.style.display = 'block';
  const deptOptions = state.depts.map(d=>`<option value="${escapeHtml(d)}" ${entry&&entry.dept===d?'selected':''}>${escapeHtml(d)}</option>`).join('');
  const cityOptions = CITY_ORDER.map(c=>`<option value="${c}" ${entry&&entry.city===c?'selected':''}>${c}</option>`).join('');
  card.innerHTML = `
    <div class="grid">
      <div><label>القسم</label>
        <select id="f_dept">${deptOptions}</select>
      </div>
      <div><label>المحافظة / المدينة</label>
        <select id="f_city">${cityOptions}<option value="__other" ${entry && !CITY_ORDER.includes(entry.city)?'selected':''}>أخرى...</option></select>
      </div>
      <div><label>الاسم</label><input id="f_name" value="${entry?escapeHtml(entry.name):''}" placeholder="مثال: عيادة د. فلان"></div>
      <div><label>الاختصاص / ملاحظة</label><input id="f_specialty" value="${entry?escapeHtml(entry.specialty):''}" placeholder="مثال: اخصائي جراحة كلى"></div>
      <div><label>رقم الهاتف</label><input id="f_phone" value="${entry?escapeHtml(entry.phone):''}" placeholder="079xxxxxxx"></div>
      <div><label>المنطقة الفرعية</label><input id="f_subregion" value="${entry?escapeHtml(entry.subregion):''}" placeholder="مثال: قضية اربد"></div>
      <div style="grid-column:1/-1"><label>العنوان</label><input id="f_address" value="${entry?escapeHtml(entry.address):''}" placeholder="العنوان بالتفصيل"></div>
    </div>
    <div class="hint">إذا كانت المحافظة غير موجودة اختر "أخرى..." واكتب اسمها.</div>
    <div id="otherCityWrap" style="margin-top:8px;${entry && !CITY_ORDER.includes(entry.city)?'':'display:none;'}">
      <label>اسم المحافظة الأخرى</label><input id="f_city_other" value="${entry && !CITY_ORDER.includes(entry.city)?escapeHtml(entry.city):''}">
    </div>
    <div class="actions">
      <button class="btn-primary" id="saveBtn">${entry?'حفظ التعديل':'إضافة'}</button>
      <button class="btn-secondary" id="backBtn">↩ رجوع للعيادات</button>
      <button class="btn-secondary" id="cancelBtn">إلغاء</button>
    </div>
  `;
  const citySel = card.querySelector('#f_city');
  citySel.onchange = ()=>{
    card.querySelector('#otherCityWrap').style.display = citySel.value==='__other' ? '' : 'none';
  };
  card.querySelector('#saveBtn').onclick = submitForm;
  card.querySelector('#cancelBtn').onclick = closeForm;
  card.querySelector('#backBtn').onclick = ()=>{
    closeForm();
    document.getElementById('tabs').scrollIntoView({behavior:'smooth'});
  };
  card.scrollIntoView({behavior:'smooth'});
}

function closeForm(){
  editingId = null;
  currentImageData = null;
  document.getElementById('formCard').style.display = 'none';
}

function submitForm(){
  const dept = document.getElementById('f_dept').value;
  let city = document.getElementById('f_city').value;
  if(city==='__other'){
    city = document.getElementById('f_city_other').value.trim();
    if(!city){ alert('اكتب اسم المحافظة'); return; }
  }
  const name = document.getElementById('f_name').value.trim();
  if(!name){ alert('اكتب اسم العيادة'); return; }
  const specialty = document.getElementById('f_specialty').value.trim();
  const phone = document.getElementById('f_phone').value.trim();
  const subregion = document.getElementById('f_subregion').value.trim();
  const address = document.getElementById('f_address').value.trim();

  const image = currentImageData || null;

  if(editingId){
    const e = state.entries.find(x=>x.id===editingId);
    Object.assign(e, {dept, city, name, specialty, phone, subregion, address, image, ts: Date.now()});
  } else {
    const maxId = state.entries.reduce((m,e)=>Math.max(m,e.id),0);
    state.entries.push({id:maxId+1, dept, city, name, specialty, phone, subregion, address, image, ts: Date.now()});
  }
  activeDept = dept;
  currentImageData = null;
  saveData();
  closeForm();
  renderAll();
  document.getElementById('tabs').scrollIntoView({behavior:'smooth'});
}

document.getElementById('openAddBtn').onclick = ()=>{
  if(state.depts.length===0){
    const name = prompt('لا يوجد أقسام بعد. اكتب اسم القسم الأول:');
    if(!name || !name.trim()) return;
    state.depts.push(name.trim());
    activeDept = name.trim();
    saveData();
  }
  openForm(null);
};

document.getElementById('searchBox').oninput = (e)=>{
  searchTerm = e.target.value.trim();
  renderList();
};

let imgPanelOpen = false;

function updateHeaderImgBtn(){
  const count = Array.isArray(state.headerImages) ? state.headerImages.length : 0;
  document.getElementById('headerImgBtn').textContent = count
    ? `🖼 إضافة صور للـPDF (${count})`
    : '🖼 إضافة صور للـPDF';
  const manageBtn = document.getElementById('headerImgClearBtn');
  manageBtn.style.display = count ? '' : 'none';
  manageBtn.textContent = imgPanelOpen ? '🗑 إغلاق إدارة الصور' : `🗑 إدارة الصور (${count})`;
  if(!count) imgPanelOpen = false;
  renderHeaderImgPanel();
}

function renderHeaderImgPanel(){
  const panel = document.getElementById('headerImgPanel');
  const imgs = Array.isArray(state.headerImages) ? state.headerImages : [];
  if(!imgPanelOpen || imgs.length===0){
    panel.style.display = 'none';
    panel.innerHTML = '';
    return;
  }
  panel.style.display = 'block';
  panel.innerHTML = '<div class="img-panel-hint">اضغط ✕ على أي صورة لحذفها فقط، بدون التأثير على باقي الصور:</div><div class="img-grid" id="imgGrid"></div>';
  const grid = panel.querySelector('#imgGrid');
  imgs.forEach((src, idx)=>{
    const box = document.createElement('div');
    box.className = 'img-thumb';
    box.innerHTML = `<img src="${src}" alt="صورة ${idx+1}"><button class="del-x" title="حذف هذه الصورة">✕</button>`;
    box.querySelector('.del-x').onclick = ()=>{
      if(confirm('حذف هذه الصورة فقط من صور غلاف الـPDF؟')){
        state.headerImages.splice(idx, 1);
        state.headerImage = null;
        saveData();
        updateHeaderImgBtn();
      }
    };
    grid.appendChild(box);
  });
}

const headerImgInput = document.getElementById('headerImgInput');
document.getElementById('headerImgBtn').onclick = ()=>{
  headerImgInput.value = '';
  headerImgInput.click();
};
document.getElementById('headerImgClearBtn').onclick = ()=>{
  imgPanelOpen = !imgPanelOpen;
  updateHeaderImgBtn();
};
headerImgInput.onchange = async (ev)=>{
  const files = Array.from(ev.target.files || []);
  if(!files.length) return;
  try{
    const newImages = await Promise.all(files.map(file=>new Promise((resolve,reject)=>{
      readImageFile(file, resolve);
    })));
    if(!Array.isArray(state.headerImages)) state.headerImages = [];
    state.headerImages.push(...newImages);
    state.headerImage = null;
    saveData();
    updateHeaderImgBtn();
    alert(`تم حفظ ${newImages.length} صورة. ستظهر كل صورة في صفحة مستقلة في بداية ملف الـPDF، ثم تبدأ صفحات العيادات.`);
  }catch(err){
    console.error(err);
    alert('تعذر حفظ إحدى الصور.');
  }finally{
    headerImgInput.value = '';
  }
};
updateHeaderImgBtn();

function buildDeptContentHtml(){
  const EXCLUDED_DEPTS = ['مستشفيات','المستشفيات'];
  let html = '';
  state.depts.forEach(dep=>{
    if(EXCLUDED_DEPTS.includes(dep.trim())) return;
    const deptEntries = state.entries.filter(e=>e.dept===dep);
    if(deptEntries.length===0) return;
    html += '<div class="pdf-dept-banner">'+escapeHtml(dep)+'</div>';
    html += '<table class="pdf-table"><colgroup><col class="c-img"><col class="c-name"><col class="c-addr"><col class="c-phone"></colgroup>';
    html += '<thead><tr><th>الصورة</th><th>اسم المركز</th><th>العنوان</th><th>هاتف العيادة</th></tr></thead><tbody>';
    deptEntries.slice().sort((a,b)=> (a.ts||0)-(b.ts||0)).forEach(e=>{
      const base = (e.subregion? e.subregion+' - ':'') + (e.address||'');
      const addr = (e.city && e.city!=='عمان') ? (e.city+' – '+base) : base;
      html += '<tr>';
      html += '<td class="img-cell">'+(e.image?('<img src="'+e.image+'">'):'')+'</td>';
      html += '<td class="name-cell"><b>'+escapeHtml(e.name)+'</b>'+(e.specialty?'<span>'+escapeHtml(e.specialty)+'</span>':'')+'</td>';
      html += '<td>'+escapeHtml(addr)+'</td>';
      const phoneParts = String(e.phone||'').split(/[\/\u060C,\n]+/).map(s=>s.trim()).filter(Boolean);
      html += '<td class="phone-cell">'+phoneParts.map(p=>'<div class="phone-line">'+escapeHtml(p)+'</div>').join('')+'</td>';
      html += '</tr>';
    });
    html += '</tbody></table>';
  });
  return html;
}

function getHeaderImages(){
  if(Array.isArray(state.headerImages)) return state.headerImages.filter(Boolean);
  return state.headerImage ? [state.headerImage] : [];
}

function buildPdfCoverPagesHtml(){
  return getHeaderImages().map((src, i)=>
    '<div class="pdf-cover-page"><img src="'+src+'" alt="صورة PDF '+(i+1)+'"></div>'
  ).join('');
}

function printFallback(){
  const printArea = document.getElementById('printArea');
  const logoSrc = 'data:image/jpeg;base64,'+PDF_LOGO_B64;
  const logoRow = '<tr class="logo-row"><td colspan="4"><div class="pdf-logo-header"><img src="'+logoSrc+'"></div></td></tr>';
  printArea.innerHTML =
    buildPdfCoverPagesHtml() +
    '<div class="pdf-title-banner">المراكز الطبية المعتمدة</div>' +
    '<table class="pdf-table"><colgroup><col class="c-img"><col class="c-name"><col class="c-addr"><col class="c-phone"></colgroup>' +
    '<thead>'+logoRow+'</thead>' +
    '<tbody>'+buildDeptContentHtml()+'</tbody></table>';
  window.print();
}

document.getElementById('pdfBtn').onclick = async ()=>{
  const btn = document.getElementById('pdfBtn');
  const oldLabel = btn.textContent;

  // If the PDF libraries failed to load (e.g. no internet on first run),
  // fall back to the browser print dialog.
  if(typeof html2canvas === 'undefined' || typeof window.jspdf === 'undefined'){
    printFallback();
    return;
  }

  btn.disabled = true;
  btn.textContent = 'جارِ التجهيز...';
  try{
    const { jsPDF } = window.jspdf;
    const coverImages = getHeaderImages();
    const logoSrc = 'data:image/jpeg;base64,'+PDF_LOGO_B64;
    const logoHtml = '<div class="pdf-logo-header"><img src="'+logoSrc+'"></div>';

    const PAGE_W = 794, PAGE_H = 1123, MARGIN = 34; // A4 @ 96dpi, ~0.9cm margin
    const CONTENT_W = PAGE_W - MARGIN*2;
    const CONTENT_H = PAGE_H - MARGIN*2;
    const SCALE = 2;

    const stage = document.createElement('div');
    stage.style.cssText = 'position:fixed; left:-99999px; top:0; width:'+CONTENT_W+'px; background:#fff;';
    document.body.appendChild(stage);

    const header1El = document.createElement('div');
    header1El.innerHTML = '<div class="pdf-title-banner">المراكز الطبية المعتمدة</div>' + logoHtml;
    const headerRepeatEl = document.createElement('div');
    headerRepeatEl.innerHTML = logoHtml;
    const bodyEl = document.createElement('div');
    bodyEl.innerHTML = buildDeptContentHtml();
    stage.appendChild(header1El);
    stage.appendChild(headerRepeatEl);
    stage.appendChild(bodyEl);

    // Measure atomic units so a page break never lands in the middle of a row.
    const bodyTop = bodyEl.getBoundingClientRect().top;
    const units = [];
    const kids = Array.from(bodyEl.children);
    for(let i=0;i<kids.length;i++){
      const child = kids[i];
      if(child.classList.contains('pdf-dept-banner')){
        const table = kids[i+1];
        const headerRow = table.querySelector('thead tr');
        units.push({
          top: child.getBoundingClientRect().top - bodyTop,
          bottom: headerRow.getBoundingClientRect().bottom - bodyTop
        });
        table.querySelectorAll('tbody tr').forEach(tr=>{
          const r = tr.getBoundingClientRect();
          units.push({ top:r.top-bodyTop, bottom:r.bottom-bodyTop });
        });
      }
    }

    const header1H = header1El.getBoundingClientRect().height;
    const headerRepeatH = headerRepeatEl.getBoundingClientRect().height;
    const pageAvailH = CONTENT_H;

    const [header1Canvas, headerRepeatCanvas, bodyCanvas] = await Promise.all([
      html2canvas(header1El, {scale:SCALE, backgroundColor:'#ffffff'}),
      html2canvas(headerRepeatEl, {scale:SCALE, backgroundColor:'#ffffff'}),
      html2canvas(bodyEl, {scale:SCALE, backgroundColor:'#ffffff'})
    ]);
    stage.remove();

    // Decide where each clinic page starts/ends, snapped to unit boundaries.
    const pages = [];
    if(units.length){
      let cursor = 0;
      let pageStartOffset = units[0].top;
      let first = true;
      while(cursor < units.length){
        const headerH = first ? header1H : headerRepeatH;
        const limit = pageStartOffset + (pageAvailH - headerH);
        let lastFit = cursor;
        for(let j=cursor;j<units.length;j++){
          if(units[j].bottom <= limit + 0.5){ lastFit = j; } else break;
        }
        if(lastFit < cursor) lastFit = cursor;
        pages.push({ top: pageStartOffset, bottom: units[lastFit].bottom, first });
        cursor = lastFit + 1;
        if(cursor < units.length) pageStartOffset = units[cursor].top;
        first = false;
      }
    } else {
      pages.push({top:0, bottom:0, first:true});
    }

    const pdf = new jsPDF({ unit:'px', format:[PAGE_W, PAGE_H] });

    // IMPORTANT: each selected image is a full, independent first page.
    // Clinic pages start only after all cover images have been added.
    for(let i=0;i<coverImages.length;i++){
      if(i>0) pdf.addPage([PAGE_W, PAGE_H]);
      const img = new Image();
      img.src = coverImages[i];
      await new Promise((resolve,reject)=>{
        if(img.complete && img.naturalWidth) return resolve();
        img.onload = resolve;
        img.onerror = reject;
      });
      const iw = img.naturalWidth || img.width;
      const ih = img.naturalHeight || img.height;
      const scale = Math.min(CONTENT_W/iw, CONTENT_H/ih);
      const drawW = iw * scale;
      const drawH = ih * scale;
      const x = MARGIN + (CONTENT_W - drawW)/2;
      const y = MARGIN + (CONTENT_H - drawH)/2;
      pdf.addImage(coverImages[i], 'JPEG', x, y, drawW, drawH);
    }

    pages.forEach((p, i)=>{
      const headerCanvas = p.first ? header1Canvas : headerRepeatCanvas;
      const headerHcss = p.first ? header1H : headerRepeatH;
      const sliceTopPx = Math.round(p.top * SCALE);
      const sliceHeightPx = Math.max(0, Math.round((p.bottom - p.top) * SCALE));

      const pageCanvas = document.createElement('canvas');
      pageCanvas.width = CONTENT_W * SCALE;
      pageCanvas.height = headerCanvas.height + sliceHeightPx;
      const ctx = pageCanvas.getContext('2d');
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0,0,pageCanvas.width,pageCanvas.height);
      ctx.drawImage(headerCanvas, 0, 0);
      if(sliceHeightPx > 0){
        ctx.drawImage(bodyCanvas, 0, sliceTopPx, bodyCanvas.width, sliceHeightPx, 0, headerCanvas.height, bodyCanvas.width, sliceHeightPx);
      }

      const imgData = pageCanvas.toDataURL('image/jpeg', 0.92);
      const drawHeightCss = headerHcss + (p.bottom - p.top);
      if(coverImages.length > 0 || i > 0) pdf.addPage([PAGE_W, PAGE_H]);
      pdf.addImage(imgData, 'JPEG', MARGIN, MARGIN, CONTENT_W, drawHeightCss);
    });

    pdf.save('عيادات_شبكة_وقايتي.pdf');
  }catch(err){
    console.error(err);
    alert('صار في خطأ أثناء تجهيز ملف الـPDF. رح نجرب الطباعة العادية كبديل.');
    printFallback();
  }finally{
    btn.disabled = false;
    btn.textContent = oldLabel;
  }
};

document.getElementById('resetBtn').onclick = ()=>{
  if(confirm('هذا سيمسح كل العيادات المضافة ويرجع للقائمة الأصلية فقط. متأكد؟')){
    localStorage.removeItem(STORAGE_KEY);
    state = loadData();
    activeDept = state.depts[0] || null;
    renderAll();
  }
};

function renderAll(){
  renderCount();
  renderTabs();
  renderList();
}
renderAll();
</script>
